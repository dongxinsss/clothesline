main:not(.dual):not(.theme):not(.cta) .basket-strip{padding:20px 28px}</style><main id="poster"></main><script>
const media='../../media/',icon='../../../frontend/appicon.svg';
const posterHeader=(n,kind)=>`<div class="brand"><img src="${icon}" alt="拾光绳"><b>拾光绳 / CLOTHESLINE</b><span>${kind} · ${n} / 05</span></div>`;
const foot=(n)=>`<div class="footer"><div><b>把截图挂起来，把工作接下去。</b><br>浏览器交互演示 · 仅含示例数据</div><div>0.4.1 PREVIEW<br>${n} / 05</div></div>`;
const pic=(name,style)=>`<div class="shot ${style}"><img src="${media+name}.jpg" alt="拾光绳${name}演示截图"></div>`;
const scenes={
2:posterHeader('02','随手收纳')+`<p class="kicker">给刚刚截下来的东西，一个位置</p><h1>截图和文字，<br>先挂一下。</h1><p class="lead">来不及分类没关系，<br>先留在手边，继续做眼前的事。</p><div class="rope"></div>`+pic('overview','shelf')+`<div class="points"><div class="point"><span class="num">01</span><div><strong>复制一张截图，就能接住</strong><p>开启自动收集，收纳剪贴板里的新图片。</p></div></div><div class="point"><span class="num">02</span><div><strong>碎碎念，也有地方放</strong><p>手动贴文字、写便签；普通复制的文字不自动记。</p></div></div><div class="point"><span class="num">03</span><div><strong>需要时，再拿去用</strong><p>支持复制、保存和拖到接受该内容的应用。</p></div></div></div><div class="basket-strip"><img src="${icon}" alt="小入口">展开是一条绳，收起是一个小篮子。</div>`+foot('02'),
3:posterHeader('03','日程与历史')+`<p class="kicker">别让刚刚的想法，转头就不见</p><h1>今天的事记下来，<br>之前的东西找得到。</h1><p class="lead">日程看当天、本周、本月；历史重开也保留。</p><div class="section-label">日程 · 给时间留个位置 <em>当天 / 本周 / 本月</em></div>`+pic('schedule','panel')+`<div class="section-label">历史 · 每一段拾光，都留着 <em>搜索 / 预览 / 重新挂上</em></div>`+pic('history','history')+`<p class="note">移下来的卡片还能找回。<br>日程目前为本地安排列表，不含系统提醒或云同步。</p>`+foot('03'),
4:posterHeader('04','让它刚刚好')+`<p class="kicker">每个人的桌面习惯，都不一样</p><h1>颜色、字号，<br>按自己的习惯来。</h1><p class="lead">让它顺手，也让眼睛舒服一点。</p><div class="theme-swatches"><div class="swatch" style="--bg:#edf5fa;--ink:#527d98">晴空浅蓝</div><div class="swatch" style="--bg:#233642;--ink:#bdd6e4">静夜深色</div><div class="swatch" style="--bg:#f3eee3;--ink:#897459">暖纸米白</div><div class="swatch" style="--bg:#fff;--ink:#143e59">清晰高对比</div></div>`+pic('settings','panel')+`<div class="capsule"><span>字号可以分开调</span><span>界面 / 正文 / 时间说明</span></div><div class="capsule"><span>多久不用自动收起</span><span>自定义时长 / 永不隐藏</span></div><p class="note">编辑、截图、拖出内容时暂停空闲计时。<br>设置保存，下次打开继续用。</p>`+foot('04'),
5:posterHeader('05','一起试试')+`<p class="kicker">给桌面留白，给灵感留位置</p><h1>这个小工具，<br>我把源码公开了。</h1><p class="lead">不需要登录账号，内容保存在本机。<br>MIT 开源，欢迎来试用和提建议。</p><div class="repo-card"><div class="account">在 GITHUB 搜索</div><div class="repo">dongxinsss / clothesline</div><div class="tag">源码</div> <div class="tag">使用教程</div> <div class="tag">预览包下载</div><div class="langs"><span>简体中文</span><span>繁體中文</span><span>English</span><span>日本語</span></div><div class="url">github.com/dongxinsss/clothesline</div></div><div class="instructions"><div><i>01</i><span>打开项目首页，先看看功能和教程</span></div><div><i>02</i><span>在 Releases 下载对应平台的预览包</span></div><div><i>03</i><span>发现问题，用示例内容反馈给我</span></div></div><p class="endline">你最想把什么东西，<br><strong>挂在这条绳上？</strong></p><p class="fine">macOS 有本机测试；Windows 已编译，尚未真机验证。<br>应用界面目前为中文；四语支持指使用文档。</p>`+foot('05')};
const poster=document.getElementById('poster');const page=Number(new URLSearchParams(location.search).get('page')||2);poster.innerHTML=scenes[page]||scenes[2];if(page===3)poster.className='dual';if(page===4)poster.className='theme';if(page===5)poster.className='cta';
</script></html>
